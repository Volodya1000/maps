[project]
name = "cableroute-development"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pre-commit==4.3.0",
  "ruff==0.13.3",
  "towncrier==24.8.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
extend-exclude = ["artifacts"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

name: Full Belarus offline installers
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build installers or explicitly publish versioned geodata
        type: choice
        default: installers
        options: [installers, geodata]
permissions:
  contents: read
concurrency:
  group: full-belarus-installers
  cancel-in-progress: false
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 'true'
jobs:
  geodata:
    if: inputs.mode != 'geodata'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/country-data
      - uses: actions/upload-artifact@v7
        with:
          name: belarus-offline-data
          path: artifacts/belarus/
          compression-level: 0
  android:
    needs: geodata
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Read release version
        run: python3 tools/release_version.py >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: belarus-offline-data
          path: artifacts/belarus
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - run: dotnet workload install android --skip-manifest-update
      - run: dotnet restore src/CableRoutePlanner.Android --locked-mode
      - name: Prepare preview signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_TEST_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo 'ANDROID_TEST_KEYSTORE must contain the stable release signing key.' >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/preview.keystore"
      - name: Build lightweight APK with Minsk map
        run: dotnet publish src/CableRoutePlanner.Android -c Release -p:AndroidVersionCode="$ANDROID_VERSION_CODE" -p:GeodataDirectory="$GITHUB_WORKSPACE/samples/real-geodata-fixtures/minsk" -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$RUNNER_TEMP/preview.keystore" -p:AndroidSigningKeyAlias=androiddebugkey -p:AndroidSigningKeyPass=android -p:AndroidSigningStorePass=android
      - run: |
          mkdir -p artifacts/apk
          cp src/CableRoutePlanner.Android/bin/Release/net8.0-android/publish/by.cablerouteplanner.app-Signed.apk "artifacts/apk/CableRoutePlanner-${RELEASE_VERSION}-Minsk.apk"
      - run: dotnet clean src/CableRoutePlanner.Android -c Release
      - name: Split country map into bounded Android assets
        run: python3 tools/split_android_map.py artifacts/belarus artifacts/android-belarus
      - run: dotnet publish src/CableRoutePlanner.Android -c Release -p:AndroidVersionCode="$ANDROID_VERSION_CODE" -p:GeodataDirectory="$GITHUB_WORKSPACE/artifacts/android-belarus" -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$RUNNER_TEMP/preview.keystore" -p:AndroidSigningKeyAlias=androiddebugkey -p:AndroidSigningKeyPass=android -p:AndroidSigningStorePass=android
      - run: |
          mkdir -p artifacts/apk
          cp src/CableRoutePlanner.Android/bin/Release/net8.0-android/publish/by.cablerouteplanner.app-Signed.apk "artifacts/apk/CableRoutePlanner-${RELEASE_VERSION}-Belarus.apk"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump permissions "artifacts/apk/CableRoutePlanner-${RELEASE_VERSION}-Belarus.apk" > artifacts/apk/permissions.txt
          if rg 'android.permission.INTERNET' artifacts/apk/permissions.txt; then exit 1; fi
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "artifacts/apk/CableRoutePlanner-${RELEASE_VERSION}-Belarus.apk" > artifacts/apk/signature.txt
      - uses: actions/upload-artifact@v7
        with:
          name: full-belarus-apk
          path: artifacts/apk/
          compression-level: 0
  windows:
    needs: geodata
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Read release version
        shell: pwsh
        run: python tools/release_version.py | Add-Content -Path $env:GITHUB_ENV
      - uses: actions/download-artifact@v8
        with:
          name: belarus-offline-data
          path: artifacts/belarus
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          skip-lts-prepass: true
      - name: Unpack map and verify application
        shell: pwsh
        run: |
          $inputStream = [IO.File]::OpenRead("$pwd/artifacts/belarus/geodata.sqlite.gz")
          $gzip = [IO.Compression.GZipStream]::new($inputStream, [IO.Compression.CompressionMode]::Decompress)
          $outputStream = [IO.File]::Create("$pwd/artifacts/belarus/geodata.sqlite")
          $gzip.CopyTo($outputStream)
          $outputStream.Dispose()
          $gzip.Dispose()
          $inputStream.Dispose()
          dotnet restore CableRoutePlanner.Desktop.slnf --locked-mode
          dotnet test CableRoutePlanner.Desktop.slnf -c Release --no-restore
          dotnet run --project tools/CableRoutePlanner.Verify -c Release --no-restore -- --inspect artifacts/belarus artifacts/belarus-package-check.json
          dotnet publish src/CableRoutePlanner.Desktop -c Release -r win-x64 --self-contained true -p:GeodataDirectory="$pwd/artifacts/belarus" -o artifacts/win-x64
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" "/DAppVersion=$env:RELEASE_VERSION" tools/Packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
      - name: Verify offline installer and desktop startup
        shell: pwsh
        run: |
          $setup = Get-ChildItem artifacts/installer/*.exe | Select-Object -First 1
          $installed = "$env:RUNNER_TEMP/CableRoutePlanner-installed"
          Start-Process -FilePath $setup.FullName -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installed") -Wait
          if (!(Test-Path "$installed/Data/manifest.json")) { throw "Bundled map not installed" }
          $process = Start-Process "$installed/CableRoutePlanner.Desktop.exe" -PassThru
          Start-Sleep -Seconds 30
          if ($process.HasExited) { throw "Installed desktop app exited at startup" }
          Stop-Process -Id $process.Id
      - uses: actions/upload-artifact@v7
        with:
          name: full-belarus-windows-installer
          path: |
            artifacts/installer/*.exe
            artifacts/belarus-package-check.json
          compression-level: 0
  android-smoke:
    needs: android
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Read release version
        run: python3 tools/release_version.py >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: full-belarus-apk
          path: artifacts/apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disk-size: 8192M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            python3 tools/android_smoke.py --apk "artifacts/apk/CableRoutePlanner-${RELEASE_VERSION}-Minsk.apk" --output artifacts/light-android-smoke --settle-seconds 90 --wait-map-ready
            python3 tools/android_smoke.py --apk "artifacts/apk/CableRoutePlanner-${RELEASE_VERSION}-Belarus.apk" --output artifacts/full-android-smoke --settle-seconds 180 --wait-map-ready
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: full-belarus-startup-evidence
          path: artifacts/full-android-smoke/
  release:
    needs: [android-smoke, windows]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/publish-preview.yml
    with:
      source_run_id: ${{ github.run_id }}

  publish-geodata:
    if: inputs.mode == 'geodata'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/country-data
        with:
          rebuild: 'true'
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Prepare and verify changed inputs (explicit publication only)
        run: |
          gzip -dk artifacts/belarus/geodata.sqlite.gz
          dotnet restore tools/CableRoutePlanner.Verify --locked-mode
          dotnet run --project tools/CableRoutePlanner.Verify -c Release --no-restore -- --inspect artifacts/belarus artifacts/belarus-package-check.json
          rm artifacts/belarus/geodata.sqlite
      - name: Stage permanent source and prepared package
        run: |
          python3 - <<'PYTHON'
          import json
          import shutil
          from pathlib import Path
          from tools.GeodataPreparation import country_data as country
          lock = json.loads(country.LOCK.read_text())
          key = country.cache_key(lock)
          tag = lock['source']['version'] + '-' + key.removeprefix('belarus-v1-')[:16]
          base = 'https://github.com/Volodya1000/maps/releases/download/' + tag
          country.pin(lock, Path('artifacts/belarus'), base)
          staging = Path('artifacts/geodata-release')
          staging.mkdir(parents=True)
          for path in Path('artifacts/belarus').rglob('*'):
              if path.is_file():
                  shutil.copyfile(path, staging / path.relative_to('artifacts/belarus').as_posix().replace('/', '--'))
          source = Path('artifacts/osm') / (lock['source']['sha256'] + '.osm.pbf')
          shutil.copyfile(source, staging / (lock['source']['version'] + '.osm.pbf'))
          # Publication also moves the permanent source to this new release.
          lock['source']['urls'][0] = base + '/' + lock['source']['version'] + '.osm.pbf'
          country.LOCK.write_text(json.dumps(lock, indent=2) + '\n')
          shutil.copyfile(country.LOCK, staging / 'belarus.lock.json')
          Path('artifacts/geodata-tag.txt').write_text(tag)
          PYTHON
      - name: Publish immutable versioned inputs without replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(cat artifacts/geodata-tag.txt)
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease --latest=false --title "Geodata $tag" --notes 'Verified OSM/Geofabrik inputs and prepared SQLite package. OpenStreetMap contributors, ODbL 1.0. Commit the accompanying belarus.lock.json to select this version.' artifacts/geodata-release/*
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: geodata-publication
          path: |
            tools/GeodataPreparation/belarus.lock.json
            artifacts/belarus-package-check.json
          if-no-files-found: error

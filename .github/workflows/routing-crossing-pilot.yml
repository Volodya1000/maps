name: Routing crossing pilot
on:
  workflow_dispatch:
    inputs:
      underpass:
        description: Audit pedestrian underpasses and compare the frozen 88 scenarios
        type: boolean
        default: false
      data_run:
        description: Successful run containing pull-request-belarus-data
        type: string
        default: '43485336517'
  pull_request:
    types: [labeled]
permissions:
  contents: read
concurrency:
  group: routing-crossing-pilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pilot:
    if: (github.event_name == 'workflow_dispatch' && !inputs.underpass) || github.event.label.name == 'ci:routing-crossing-pilot'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.12.23'
          python-version: '3.12'
      - run: uv sync --project tools/GeodataPreparation --locked
      - uses: ./.github/actions/country-data
      - name: Extract verified routing database
        run: uv run --project tools/GeodataPreparation --locked python tools/ci/routing_pilot_ci.py extract-db --data artifacts/belarus
      - run: dotnet build tools/CableRoutePlanner.Verify -c Release -warnaserror
      - name: Generate frozen inputs
        run: uv run --project tools/GeodataPreparation --locked python tools/routing_crossing_pilot.py generate --data artifacts/belarus --output artifacts/routing-crossing-pilot
      - name: Run bounded pilot
        env:
          PILOT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: uv run --project tools/GeodataPreparation --locked python tools/routing_crossing_pilot.py run --data artifacts/belarus --verify-dll tools/CableRoutePlanner.Verify/bin/Release/net8.0/CableRoutePlanner.Verify.dll --output artifacts/routing-crossing-pilot
      - name: Run indirect crossing study
        run: uv run --project tools/GeodataPreparation --locked python tools/routing_indirect_study.py --data artifacts/belarus --verify-dll tools/CableRoutePlanner.Verify/bin/Release/net8.0/CableRoutePlanner.Verify.dll --output artifacts/routing-indirect-study
      - name: Generate frozen mass corpus
        run: uv run --project tools/GeodataPreparation --locked python tools/routing_mass_experiment.py freeze --data artifacts/belarus --output artifacts/routing-mass
      - name: Run mass baseline
        run: uv run --project tools/GeodataPreparation --locked python tools/routing_mass_experiment.py run --data artifacts/belarus --verify-dll tools/CableRoutePlanner.Verify/bin/Release/net8.0/CableRoutePlanner.Verify.dll --output artifacts/routing-mass
      - name: Summarize mass baseline and selected failures
        run: |
          cp docs/evidence/routing-mass-v1/source-inventory.json artifacts/routing-mass/source-inventory.json
          uv run --project tools/GeodataPreparation --locked python tools/routing_mass_diagnostics.py --run artifacts/routing-mass --output artifacts/routing-mass/cases mass-naliboki-bridge-01 pukhovichi-01 mass-brest-multi-06
          uv run --project tools/GeodataPreparation --locked python tools/routing_mass_report.py --run artifacts/routing-mass --inventory artifacts/routing-mass/source-inventory.json --output artifacts/routing-mass
      - name: Publish available results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: routing-crossing-pilot-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/routing-crossing-pilot/
            artifacts/routing-indirect-study/
            artifacts/routing-mass/
          if-no-files-found: warn
      - name: Report harness integrity and pilot acceptance
        if: always()
        run: uv run --project tools/GeodataPreparation --locked python tools/ci/routing_pilot_ci.py report-pilot --report artifacts/routing-crossing-pilot/report.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Verify indirect crossing evidence
        if: always()
        run: uv run --project tools/GeodataPreparation --locked python tools/ci/routing_pilot_ci.py verify-indirect --report artifacts/routing-indirect-study/report.json

  underpass:
    if: github.event_name == 'workflow_dispatch' && inputs.underpass
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.12.23'
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: pull-request-belarus-data
          run-id: ${{ inputs.data_run }}
          github-token: ${{ github.token }}
          path: artifacts/belarus
      - name: Extract existing database and verify its manifest checksum
        run: python3 tools/ci/routing_pilot_ci.py extract-db --data artifacts/belarus
      - run: uv sync --project tools/GeodataPreparation --locked
      - run: dotnet build tools/CableRoutePlanner.Verify -c Release -warnaserror
      - name: Audit real underpass routing then compare frozen corpus
        run: >-
          uv run --project tools/GeodataPreparation --locked python tools/routing_underpass_study.py
          --data artifacts/belarus
          --verify-dll tools/CableRoutePlanner.Verify/bin/Release/net8.0/CableRoutePlanner.Verify.dll
          --output artifacts/routing-underpass
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: routing-underpass-${{ github.run_id }}
          path: artifacts/routing-underpass/
          retention-days: 30
          if-no-files-found: error

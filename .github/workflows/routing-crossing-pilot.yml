name: Routing crossing pilot
on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Optional baseline commit or ref for same-package frozen-corpus comparison
        type: string
        default: ''
  pull_request:
    types: [labeled, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: routing-crossing-pilot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  frozen-regression:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'ci:routing-crossing-pilot')
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      ROUTING_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ROUTING_BASELINE_REF: ${{ github.event.pull_request.base.sha || inputs.baseline_ref }}
    steps:
      - name: Check out actual current head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          persist-credentials: false
      - name: Record checked-out head
        run: |
          mkdir -p artifacts/routing-regression
          git rev-parse HEAD > artifacts/routing-regression/checkout-head.txt
          test "$(git rev-parse HEAD)" = "$ROUTING_PR_HEAD_SHA"
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.9'
          python-version: '3.12'
      - run: uv sync --project tools/GeodataPreparation --locked
      - name: Obtain current verified country package
        uses: ./.github/actions/country-data
      - name: Extract manifest-verified database
        id: routing-data
        run: uv run --project tools/GeodataPreparation --locked python tools/ci/routing_pilot_ci.py extract-db --data artifacts/belarus
      - name: Build current Verify
        run: dotnet build tools/CableRoutePlanner.Verify -c Release -warnaserror -p:RestoreLockedMode=true
      - name: Check out baseline source
        if: env.ROUTING_BASELINE_REF != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ env.ROUTING_BASELINE_REF }}
          repository: ${{ github.repository }}
          path: artifacts/routing-baseline-source
          persist-credentials: false
      - name: Build baseline Verify
        if: env.ROUTING_BASELINE_REF != ''
        working-directory: artifacts/routing-baseline-source
        run: dotnet build tools/CableRoutePlanner.Verify -c Release -warnaserror -p:RestoreLockedMode=true
      - name: Run unchanged frozen inputs and explicit controls
        shell: bash
        run: |
          baseline=()
          if [[ -n "$ROUTING_BASELINE_REF" ]]; then
            baseline+=(--baseline-verify-dll artifacts/routing-baseline-source/tools/CableRoutePlanner.Verify/bin/Release/net8.0/CableRoutePlanner.Verify.dll)
            baseline+=(--baseline-source artifacts/routing-baseline-source)
          fi
          uv run --project tools/GeodataPreparation --locked python tools/routing_regression.py \
            --data artifacts/belarus \
            --verify-dll tools/CableRoutePlanner.Verify/bin/Release/net8.0/CableRoutePlanner.Verify.dll \
            --output artifacts/routing-regression \
            "${baseline[@]}"
      - name: Independently inspect selected failed bridge witnesses
        if: always() && steps.routing-data.outcome == 'success'
        run: >-
          uv run --project tools/GeodataPreparation --locked python tools/routing_portal_witnesses.py
          --data artifacts/belarus
          --output artifacts/routing-regression/portal-witnesses.json
      - name: Publish concise routing evidence
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/routing-regression/summary.md ]]; then
            cat artifacts/routing-regression/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Routing regression did not run: a prerequisite failed. See job logs and available evidence.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve raw results and reproducible metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: routing-regression-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/routing-regression/
            artifacts/belarus/manifest.json
            artifacts/belarus/package.json
          retention-days: 30
          if-no-files-found: error

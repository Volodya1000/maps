name: Pull request Android APKs
on:
  workflow_run:
    workflows: [Build and verify]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: pull-request-apks-${{ github.event.workflow_run.pull_requests[0].number }}
  cancel-in-progress: true
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 'true'
jobs:
  verify-source:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].head.sha == github.event.workflow_run.head_sha
    runs-on: ubuntu-22.04
    steps:
      - name: Confirm tested commit
        env:
          PR_HEAD: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test -n "$PR_HEAD" && test "$PR_HEAD" = "$TESTED_SHA"

  geodata:
    needs: verify-source
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.12.23'
          python-version: '3.12'
      - uses: actions/cache@v6
        id: data-cache
        with:
          path: artifacts/belarus
          key: belarus-a2327228173b7fe8e74e2097e3dae0d4-${{ hashFiles('tools/GeodataPreparation/prepare_country.py', 'tools/GeodataPreparation/prepare.py') }}
      - if: steps.data-cache.outputs.cache-hit != 'true'
        name: Download verified OSM snapshot
        run: |
          uv sync --project tools/GeodataPreparation --locked
          curl --fail --location --retry 3 --connect-timeout 30 --max-time 900 https://download.geofabrik.de/europe/belarus-261022.osm.pbf --output source.osm.pbf
      - if: steps.data-cache.outputs.cache-hit != 'true'
        name: Prepare country database and compressed asset
        run: |
          uv run --project tools/GeodataPreparation --locked python tools/GeodataPreparation/prepare_country.py --pbf source.osm.pbf --expected-md5 a2327228173b7fe8e74e2097e3dae0d4 --output artifacts/belarus --compress
          cp -r samples/real-geodata-fixtures/minsk/licenses artifacts/belarus/
          rm artifacts/belarus/geodata.sqlite
      - name: Include country attribution
        run: |
          cp tools/GeodataPreparation/COUNTRY-NOTICE.txt artifacts/belarus/NOTICE.txt
          cp tools/GeodataPreparation/COUNTRY-NOTICE.txt artifacts/belarus/licenses/NOTICE.txt
      - uses: actions/upload-artifact@v7
        with:
          name: pull-request-belarus-data
          path: artifacts/belarus/
          compression-level: 0

  android:
    needs: [verify-source, geodata]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/download-artifact@v8
        with:
          name: pull-request-belarus-data
          path: artifacts/belarus
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - run: dotnet workload install android --skip-manifest-update
      - name: Prepare preview signing key
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/preview.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=CableRoutePlanner Preview,O=Test,C=BY'
      - name: Build lightweight Minsk APK
        run: dotnet publish src/CableRoutePlanner.Android -c Release -p:GeodataDirectory="$GITHUB_WORKSPACE/samples/real-geodata-fixtures/minsk" -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$RUNNER_TEMP/preview.keystore" -p:AndroidSigningKeyAlias=androiddebugkey -p:AndroidSigningKeyPass=android -p:AndroidSigningStorePass=android
      - run: |
          mkdir -p artifacts/apk
          cp src/CableRoutePlanner.Android/bin/Release/net8.0-android/publish/by.cablerouteplanner.app-Signed.apk artifacts/apk/CableRoutePlanner-PR-${{ github.event.pull_request.number }}-Minsk.apk
      - run: dotnet clean src/CableRoutePlanner.Android -c Release
      - name: Split country map into bounded Android assets
        run: python3 tools/split_android_map.py artifacts/belarus artifacts/android-belarus
      - name: Build full Belarus APK
        run: dotnet publish src/CableRoutePlanner.Android -c Release -p:GeodataDirectory="$GITHUB_WORKSPACE/artifacts/android-belarus" -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$RUNNER_TEMP/preview.keystore" -p:AndroidSigningKeyAlias=androiddebugkey -p:AndroidSigningKeyPass=android -p:AndroidSigningStorePass=android
      - run: |
          cp src/CableRoutePlanner.Android/bin/Release/net8.0-android/publish/by.cablerouteplanner.app-Signed.apk artifacts/apk/CableRoutePlanner-PR-${{ github.event.pull_request.number }}-Belarus.apk
          sha256sum artifacts/apk/*.apk > artifacts/apk/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          path: artifacts/apk/CableRoutePlanner-PR-${{ github.event.workflow_run.pull_requests[0].number }}-Minsk.apk
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: artifacts/apk/CableRoutePlanner-PR-${{ github.event.workflow_run.pull_requests[0].number }}-Belarus.apk
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: artifacts/apk/SHA256SUMS.txt
          if-no-files-found: error

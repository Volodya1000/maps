name: Pull request Android APKs
on:
  workflow_call:
    inputs:
      pr_number:
        description: Pull request number from the caller's pull_request payload
        required: true
        type: string
      tested_sha:
        description: Exact commit SHA checked by the caller workflow
        required: true
        type: string
permissions:
  contents: read
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 'true'
jobs:
  verify-source:
    runs-on: ubuntu-22.04
    steps:
      - name: Confirm tested commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_NUMBER_PAYLOAD: ${{ github.event.pull_request.number }}
          TESTED_SHA: ${{ inputs.tested_sha }}
        run: |
          test "$EVENT_NAME" = pull_request
          test -n "$PR_NUMBER_PAYLOAD" && test "$PR_NUMBER" = "$PR_NUMBER_PAYLOAD"
          [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]

  geodata:
    needs: verify-source
    outputs:
      android_version_code: ${{ steps.version.outputs.android_version_code }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tested_sha }}
      - name: Read application version
        id: version
        run: echo "android_version_code=$(python3 tools/release_version.py | sed -n 's/^ANDROID_VERSION_CODE=//p')" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/country-data
      - uses: actions/upload-artifact@v7
        with:
          name: pull-request-belarus-data
          path: artifacts/belarus/
          retention-days: 1
          compression-level: 0

  android:
    needs: [verify-source, geodata]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      ANDROID_VERSION_CODE: ${{ needs.geodata.outputs.android_version_code }}
      # The signing key is temporary. A per-attempt package ID prevents Android
      # from treating different PR previews as incompatible updates.
      PREVIEW_PACKAGE_ID: by.cablerouteplanner.preview.pr${{ inputs.pr_number }}.r${{ github.run_id }}a${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tested_sha }}
      - uses: actions/download-artifact@v8
        with:
          name: pull-request-belarus-data
          path: artifacts/belarus
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - run: dotnet workload install android --skip-manifest-update
      - uses: actions/download-artifact@v8
        with:
          name: pull-request-preview-base
          path: ${{ runner.temp }}/preview-base
      - name: Reuse the tested Minsk preview
        run: |
          mkdir -p artifacts/apk
          cp "$RUNNER_TEMP/preview-base/Minsk.apk" "artifacts/apk/CableRoutePlanner-PR-${{ inputs.pr_number }}-Minsk.apk"
          test -s "$RUNNER_TEMP/preview-base/preview.keystore"
      - name: Split country map into bounded Android assets
        run: python3 tools/split_android_map.py artifacts/belarus artifacts/android-belarus
      - name: Build full Belarus APK
        run: dotnet publish src/CableRoutePlanner.Android -c Release -p:AndroidVersionCode="$ANDROID_VERSION_CODE" -p:ApplicationId="$PREVIEW_PACKAGE_ID" -p:GeodataDirectory="$GITHUB_WORKSPACE/artifacts/android-belarus" -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$RUNNER_TEMP/preview-base/preview.keystore" -p:AndroidSigningKeyAlias=androiddebugkey -p:AndroidSigningKeyPass=android -p:AndroidSigningStorePass=android
      - run: |
          publish_dir=src/CableRoutePlanner.Android/bin/Release/net8.0-android/publish
          mapfile -t signed_apks < <(find "$publish_dir" -maxdepth 1 -type f -name '*-Signed.apk')
          test "${#signed_apks[@]}" -eq 1
          cp "${signed_apks[0]}" "artifacts/apk/CableRoutePlanner-PR-${{ inputs.pr_number }}-Belarus.apk"
          sha256sum artifacts/apk/*.apk > artifacts/apk/SHA256SUMS.txt
      - name: Verify distributable APK packages and signing certificates
        shell: bash
        run: |
          set -euo pipefail
          apk_tools="$ANDROID_HOME/build-tools/34.0.0"
          signer=""
          for variant in Minsk Belarus; do
            apk="artifacts/apk/CableRoutePlanner-PR-${{ inputs.pr_number }}-${variant}.apk"
            test -s "$apk"
            unzip -tq "$apk" >/dev/null
            badging=$("$apk_tools/aapt" dump badging "$apk")
            grep -F "name='$PREVIEW_PACKAGE_ID'" <<< "$badging"
            grep -F "versionCode='$ANDROID_VERSION_CODE'" <<< "$badging"
            "$apk_tools/apksigner" verify --verbose "$apk"
            actual_signer=$("$apk_tools/apksigner" verify --print-certs "$apk" |
              sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            test -n "$actual_signer"
            if [ -n "$signer" ] && [ "$signer" != "$actual_signer" ]; then
              echo "Minsk and Belarus APKs have incompatible signing certificates." >&2
              exit 1
            fi
            signer="$actual_signer"
          done

      # A signed/parsable APK is not necessarily installable: the full country
      # package is much larger than the Minsk smoke-tested build.
      - name: Enable KVM for full APK installation test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install full Belarus APK on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            apk="artifacts/apk/CableRoutePlanner-PR-${{ inputs.pr_number }}-Belarus.apk"
            echo "Installing the exact full-size APK published to users: $apk"
            stat -c '%n: %s bytes' "$apk"
            if ! adb install -r "$apk" > "$RUNNER_TEMP/belarus-install.log" 2>&1; then
              cat "$RUNNER_TEMP/belarus-install.log"
              adb logcat -d -s PackageManager PackageInstaller installd | tail -n 150 || true
              exit 1
            fi
            cat "$RUNNER_TEMP/belarus-install.log"
            adb shell pm path "$PREVIEW_PACKAGE_ID" | grep -F 'package:'
      - name: Explain preview installation behavior
        run: |
          {
            echo "## Installable Android PR previews"
            echo
            echo "APK package ID: \`$PREVIEW_PACKAGE_ID\`"
            echo
            echo "Each run/attempt uses a separate test app ID and temporary signing key."
            echo "Previews can be installed alongside the main application; they do not update older preview runs."
            echo "The exact downloadable Minsk APK passed the parent Android build and emulator startup gate."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          path: artifacts/apk/CableRoutePlanner-PR-${{ inputs.pr_number }}-Belarus.apk
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: CableRoutePlanner-PR-${{ inputs.pr_number }}-checksums
          path: artifacts/apk/SHA256SUMS.txt
          if-no-files-found: error

  routing-benchmark:
    if: contains(github.event.pull_request.labels.*.name, 'ci:routing-benchmark')
    needs: [verify-source, geodata]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tested_sha }}
      - uses: actions/download-artifact@v8
        with:
          name: pull-request-belarus-data
          path: artifacts/belarus
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Extract the verified country database
        run: gzip -dk artifacts/belarus/geodata.sqlite.gz
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore tools/CableRoutePlanner.Verify --locked-mode
      - run: dotnet build tools/CableRoutePlanner.Verify --no-restore -c Release -warnaserror
      - name: Measure cold-process local and intercity routes
        run: |
          python3 tools/benchmark_routes.py --data artifacts/belarus --verify-dll tools/CableRoutePlanner.Verify/bin/Release/net8.0/CableRoutePlanner.Verify.dll --output artifacts/routing-benchmark --timeout-seconds 120
          cat artifacts/routing-benchmark/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: routing-benchmark-${{ inputs.tested_sha }}
          path: artifacts/routing-benchmark
          if-no-files-found: error

name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 'true'
jobs:
  quality:
    outputs:
      full_maps: ${{ steps.preview-policy.outputs.full_maps }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.9'
          python-version: '3.12'
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.4'
      - name: Select optional preview artifacts
        id: preview-policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: python3 tools/ci_policy.py >> "$GITHUB_OUTPUT"
      - run: uv sync --locked
      - run: uv run --locked python tools/check.py lint
      - if: github.event_name == 'pull_request'
        env:
          CHANGELOG_BASE: origin/${{ github.base_ref }}
        run: uv run --locked python tools/check_fragments.py --base "$CHANGELOG_BASE"
      - run: uv run --locked towncrier build --version next --draft
  tests:
    needs: quality
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        if: runner.os != 'Windows'
        with:
          global-json-file: global.json
      # Keep the pinned Windows SDK separate from preinstalled multi-SDK roots.
      # SDK 8 format CLI discovery can fail there before running any diagnostics.
      - uses: actions/setup-dotnet@v6
        if: runner.os == 'Windows'
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          global-json-file: global.json
      - name: Record selected Windows SDK host
        if: runner.os == 'Windows'
        run: dotnet --info
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.9'
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y strace
      - run: uv sync --locked
      - run: uv run --locked python tools/check.py desktop
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-${{ runner.os }}
          path: artifacts/
  data:
    needs: quality
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.9'
      - run: uv sync --locked
      - run: uv run --locked python tools/check.py data
  android:
    needs: [quality, tests]
    outputs:
      preview_package_id: ${{ steps.preview_identity.outputs.package_id }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      ANDROID_APPLICATION_ID: ${{ github.event_name == 'pull_request' && format('by.cablerouteplanner.preview.pr{0}.r{1}a{2}', github.event.pull_request.number, github.run_id, github.run_attempt) || 'by.cablerouteplanner.app' }}
    steps:
      - uses: actions/checkout@v7
      - name: Record the tested preview identity
        id: preview_identity
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          print('package_id=' + os.environ['ANDROID_APPLICATION_ID'])
          PY
      - name: Read application version
        run: python3 tools/release_version.py >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Install .NET Android workload
        run: dotnet workload install android --skip-manifest-update
      - name: Prepare preview signing key
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/preview.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=CableRoutePlanner Preview,O=Test,C=BY'
          {
            echo "ANDROID_SIGNING_KEYSTORE=$RUNNER_TEMP/preview.keystore"
            echo "ANDROID_SIGNING_KEY_ALIAS=androiddebugkey"
            echo "ANDROID_SIGNING_KEY_PASSWORD=android"
            echo "ANDROID_SIGNING_STORE_PASSWORD=android"
          } >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.9'
          python-version: '3.12'
      - run: uv sync --locked
      - name: Build and verify signed Android APK
        run: uv run --locked python tools/check.py android
      - name: Preserve the tested PR preview and signing key
        if: >-
          github.event_name == 'pull_request'
        run: |
          mkdir -p artifacts/pr-preview-base
          cp artifacts/CableRoutePlanner-CI-Minsk.apk artifacts/pr-preview-base/Minsk.apk
          cp artifacts/CableRoutePlanner-CI-Minsk.apk "artifacts/CableRoutePlanner-PR-${{ github.event.pull_request.number }}-Minsk.apk"
          cp "$ANDROID_SIGNING_KEYSTORE" artifacts/pr-preview-base/preview.keystore
      - uses: actions/upload-artifact@v7
        if: >-
          github.event_name == 'pull_request'
        with:
          name: pull-request-preview-base
          path: artifacts/pr-preview-base/
          compression-level: 0
      - name: Record APK build diagnostics
        if: always()
        run: |
          mkdir -p artifacts/android-smoke
          find src/CableRoutePlanner.Android/bin/Release/net8.0-android/publish -maxdepth 1 -type f -printf '%f %s bytes\n' > artifacts/android-smoke/publish-files.txt || true
          cp artifacts/permissions.txt artifacts/android-smoke/permissions.txt 2>/dev/null || true
          cp artifacts/apk.sha256 artifacts/android-smoke/apk.sha256 2>/dev/null || true
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install APK and verify startup in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/android_smoke_retry.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-startup-evidence
          path: artifacts/android-smoke/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          path: ${{ github.event_name == 'pull_request' && format('artifacts/CableRoutePlanner-PR-{0}-Minsk.apk', github.event.pull_request.number) || 'artifacts/CableRoutePlanner-CI-Minsk.apk' }}
          archive: false
          if-no-files-found: error
  terrain-spike:
    needs: quality
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.9'
          python-version: '3.12'
      - run: uv sync --locked
      - env:
          PLAYWRIGHT_INSTALL_WITH_DEPS: '1'
        run: uv run --locked python tools/check.py terrain
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: terrain-spike-evidence
          path: artifacts/terrain-evidence/
  # Country preparation can overlap Minsk build/emulator work. Choosing the
  # post-desktop/data gate avoids converting country data for failing test PRs.
  geodata:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.number != ''
      && needs.quality.outputs.full_maps == 'true'
    needs: [quality, tests, data, terrain-spike]
    outputs:
      country_manifest_sha256: ${{ steps.country_identity.outputs.manifest_sha256 }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/country-data
      - name: Record verified country identity
        id: country_identity
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          from pathlib import Path
          print('manifest_sha256=' + hashlib.sha256(Path('artifacts/belarus/manifest.json').read_bytes()).hexdigest())
          PY
      - uses: ./.github/actions/country-elevation
      - uses: actions/upload-artifact@v7
        if: contains(github.event.pull_request.labels.*.name, 'ci:routing-benchmark') || contains(github.event.pull_request.labels.*.name, 'ci:performance-benchmark') || contains(github.event.pull_request.labels.*.name, 'ci:profile-country')
        with:
          name: pull-request-belarus-data
          path: artifacts/belarus/
          retention-days: 1
          compression-level: 0

  # Explicit opt-in: compare gzip settings on the same verified country input.
  # This research job does not replace any distributable APK/emulator gate.
  ci-performance:
    if: contains(github.event.pull_request.labels.*.name, 'ci:performance-benchmark')
    needs: geodata
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: pull-request-belarus-data
          path: artifacts/belarus
      - name: Compare gzip compression levels on identical country data
        run: python3 tools/benchmark_android_map.py artifacts/belarus artifacts/ci-performance/levels --repeats 3 --levels 1 3 6 9 --workers 1
      - name: Compare bounded parallel compression
        run: python3 tools/benchmark_android_map.py artifacts/belarus artifacts/ci-performance/workers --repeats 3 --levels 6 --workers 2 4
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-performance-${{ github.sha }}
          path: artifacts/ci-performance/
          if-no-files-found: error

  country-profile:
    if: contains(github.event.pull_request.labels.*.name, 'ci:profile-country')
    needs: geodata
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: pull-request-belarus-data
          path: artifacts/reference-country
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: '0.13.9'
          python-version: '3.12.14'
      - name: Fetch the pinned PBF for an independent profiled conversion
        run: python3 tools/GeodataPreparation/country_data.py source --output artifacts/profile-country/source.osm.pbf
      - name: Profile conversion without changing the country recipe
        shell: bash
        run: |
          set -euo pipefail
          source_hash=$(python3 -c "import json; print(json.load(open('tools/GeodataPreparation/belarus.lock.json'))['source']['sha256'])")
          mv artifacts/profile-country/source.osm.pbf "artifacts/profile-country/$source_hash.osm.pbf"
          /usr/bin/time -v -o artifacts/profile-country/resources.txt \
            uv run --project tools/GeodataPreparation --locked python -m cProfile \
            -o artifacts/profile-country/conversion.pstats tools/GeodataPreparation/prepare_country.py \
            --pbf "artifacts/profile-country/$source_hash.osm.pbf" --expected-sha256 "$source_hash" \
            --output artifacts/profile-country/package --compress
          python3 tools/GeodataPreparation/country_data.py seal --output artifacts/profile-country/package
          cmp artifacts/profile-country/package/geodata.sqlite.gz artifacts/reference-country/geodata.sqlite.gz
          cmp artifacts/profile-country/package/manifest.json artifacts/reference-country/manifest.json
          python3 - <<'PYTHON' > artifacts/profile-country/hotspots.txt
          import pstats
          pstats.Stats('artifacts/profile-country/conversion.pstats').strip_dirs().sort_stats('cumulative').print_stats(80)
          PYTHON
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: country-profile-${{ github.sha }}
          path: |
            artifacts/profile-country/resources.txt
            artifacts/profile-country/conversion.pstats
            artifacts/profile-country/hotspots.txt
          if-no-files-found: error

  pull-request-apks:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.number != ''
      && needs.quality.outputs.full_maps == 'true'
    needs: [quality, tests, data, terrain-spike, android, geodata]
    uses: ./.github/workflows/pull-request-apks.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
      tested_sha: ${{ github.sha }}
      preview_package_id: ${{ needs.android.outputs.preview_package_id }}
      country_manifest_sha256: ${{ needs.geodata.outputs.country_manifest_sha256 }}
    permissions:
      contents: read

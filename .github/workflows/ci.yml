name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: 'true'
jobs:
  quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.23'
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run --locked python tools/check.py lint
      - if: github.event_name == 'pull_request'
        env:
          CHANGELOG_BASE: origin/${{ github.base_ref }}
        run: uv run --locked python tools/check_fragments.py --base "$CHANGELOG_BASE"
      - run: uv run --locked towncrier build --version next --draft
  tests:
    needs: quality
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.23'
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y strace
      - run: uv sync --locked
      - run: uv run --locked python tools/check.py desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ runner.os }}
          path: artifacts/
  data:
    needs: quality
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.23'
      - run: uv sync --locked
      - run: uv run --locked python tools/check.py data
  android:
    needs: [quality, tests]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - run: dotnet workload install android --skip-manifest-update
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/preview.keystore
          key: cableroute-android-preview-signing-v1
      - name: Prepare preview signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_TEST_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/preview.keystore"
          elif [ ! -f "$RUNNER_TEMP/preview.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/preview.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=CableRoutePlanner Preview,O=Test,C=BY'
          fi
          {
            echo "ANDROID_SIGNING_KEYSTORE=$RUNNER_TEMP/preview.keystore"
            echo "ANDROID_SIGNING_KEY_ALIAS=androiddebugkey"
            echo "ANDROID_SIGNING_KEY_PASSWORD=android"
            echo "ANDROID_SIGNING_STORE_PASSWORD=android"
          } >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.23'
          python-version: '3.12'
      - run: uv sync --locked
      - run: uv run --locked python tools/check.py android
      - uses: actions/upload-artifact@v4
        with:
          name: android-ci-smoke-apk
          path: artifacts/CableRoutePlanner-CI-Minsk.apk
  android-smoke:
    needs: android
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-ci-smoke-apk
          path: artifacts/android-ci-smoke-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 tools/android_smoke.py --apk artifacts/android-ci-smoke-apk/CableRoutePlanner-CI-Minsk.apk --output artifacts/android-smoke --settle-seconds 90 --wait-map-ready
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-startup-evidence
          path: artifacts/android-smoke/
  terrain-spike:
    needs: quality
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.23'
          python-version: '3.12'
      - run: uv sync --locked
      - env:
          PLAYWRIGHT_INSTALL_WITH_DEPS: '1'
        run: uv run --locked python tools/check.py terrain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terrain-spike-evidence
          path: docs/evidence/maplibre-*

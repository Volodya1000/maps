name: Windows 7 Mono mkbundle feasibility

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle-x86:
    name: Build Mono x86 bundle candidate
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Download and extract official Mono x86 toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://download.mono-project.com/archive/6.12.0/windows-installer/mono-6.12.0.206-gtksharp-2.12.45-win32-0.msi'
          $installer = Join-Path $env:RUNNER_TEMP 'mono-x86.msi'
          $monoRoot = Join-Path $env:RUNNER_TEMP 'mono-x86'
          Invoke-WebRequest -Uri $url -OutFile $installer
          $actual = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '3f0e2216f52b6ecf249c3c2b9da4b6520ab46ea5307d63a7dba40cabf7e034c9') {
            throw "Mono installer SHA-256 mismatch: $actual"
          }
          New-Item -ItemType Directory -Force -Path $monoRoot | Out-Null
          $process = Start-Process msiexec.exe -ArgumentList @('/a', $installer, '/qn', "TARGETDIR=$monoRoot", '/norestart') -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Mono administrative extraction failed: $($process.ExitCode)" }
          "$monoRoot\Mono\bin" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build and bundle x86 prototype
        shell: pwsh
        run: .\tools\Windows7MonoPrototype\build-mkbundle.ps1

      - name: Check startup without Mono on PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:MONO_ENV_OPTIONS = '--trace=N:Avalonia.Win32.WinRT'
          $env:WIN7_PROTOTYPE_READY_PATH = Join-Path $env:RUNNER_TEMP 'win7-mono-ready.json'
          $exe = Join-Path $PWD 'artifacts/windows7-mono-x86/Windows7MonoPrototype.exe'
          $process = Start-Process $exe -WorkingDirectory (Split-Path $exe) -WindowStyle Hidden -PassThru
          try {
            for ($i = 0; $i -lt 30 -and -not (Test-Path $env:WIN7_PROTOTYPE_READY_PATH); $i++) {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) { throw "Prototype exited early: $($process.ExitCode)" }
            }
            if (-not (Test-Path $env:WIN7_PROTOTYPE_READY_PATH)) { throw 'Prototype did not report readiness.' }
            Start-Sleep -Seconds 5
            $process.Refresh()
            if ($process.HasExited) { throw "Prototype exited after readiness: $($process.ExitCode)" }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: windows7-mono-x86-bundle-${{ github.sha }}
          path: artifacts/windows7-mono-x86
          if-no-files-found: error
